# spack-envs/cp2k_opensource-master-force-avx512/spack-env-file/env.yaml
# Floating master track: spec is cp2k@master, lock is NEVER committed.
# cp2k_branch/cp2k_dev_repo_commit pin the cp2k_dev RECIPE repo at the
# cp2k master tip (master's build needs the newer recipes) — they do NOT
# pin the cp2k source, which floats via the spec and is recorded in the lock.
# This file is the single source of truth for all build configuration.

# Schema version for EnvironmentSpec parser.
schema_version: 1

# ── Container Images ──────────────────────────────────────────────────────
# Used by: Dockerfile.j2 ({{ builder_base_image }}, {{ runtime_base_image }})
#          Dockerfile.mirror-builder (ARG BASE_IMAGE)
# Pin floating tags by digest for reproducible FROM (authority opensource CPU).
# Refresh: podman pull registry.fedoraproject.org/fedora-minimal:45 && podman inspect ...
images:
  builder: registry.fedoraproject.org/fedora-minimal:45@sha256:05477647a380afaacc612d14f8fad016a604a7ff444dbc0f6b5a55f68a93403f
  runtime: registry.fedoraproject.org/fedora-minimal:45@sha256:05477647a380afaacc612d14f8fad016a604a7ff444dbc0f6b5a55f68a93403f

# ── Mirror Builder ────────────────────────────────────────────────────────
# Controls extra runtime package installation inside hpc-mirror-builder.
# Base compilers (gcc16/gfortran/git/python3) live in Dockerfile.mirror-builder.
mirror_builder:
  system_pkgs:
    - cmake
    - ninja-build
    - patchelf
    - unzip
    - zstd
  # Freeze Fedora GA repos and apply HPC_CF_PKG_MIRROR when set locally.
  pkg_mirror_setup: "sed -i 's|^enabled=1|enabled=0|g' /usr/share/dnf5/repos.d/*updates*.repo /etc/yum.repos.d/*updates*.repo /usr/share/dnf5/repos.d/*openh264*.repo /etc/yum.repos.d/*openh264*.repo 2>/dev/null || true; if [ -n \"${HPC_CF_PKG_MIRROR:-}\" ] && [ \"${HPC_CF_PKG_MIRROR}\" != \"official\" ]; then sed -i -e 's|^metalink=|#metalink=|g' -e \"s|^#baseurl=https\\?://download\\.example/pub/fedora/linux|baseurl=https://${HPC_CF_PKG_MIRROR}/fedora|g\" -e \"s|^baseurl=https\\?://download\\.fedoraproject\\.org/pub/fedora/linux|baseurl=https://${HPC_CF_PKG_MIRROR}/fedora|g\" /usr/share/dnf5/repos.d/fedora*.repo /etc/yum.repos.d/fedora*.repo 2>/dev/null || true; fi"
  pkg_install_cmd: "dnf5 install -y --allowerasing --setopt=install_weak_deps=0 --disablerepo='updates*,fedora-cisco-openh264'"

# ── Spack Environment ─────────────────────────────────────────────────────
spack:
  version: "1.2.2"
  env_name: cp2k-env
  toolchain: gcc16
  buildcache:
    enabled: true
    padded_length: 128
    policy: auto
    coverage: non_external
  # Image uses env scope (unlike most CP2K Dockerfiles which use site) so
  # custom repos take priority over pinned builtin after ``repo update``.
  image:
    update_builtin: true
    repo_scope: env
  # Expose the lock-resolved cp2k source commit (concrete spec → template
  # var) so the regtest clone checks out exactly what was built.
  lock_source_commits:
    cp2k: cp2k_source_commit
  # Custom repos to clone and register
  # Supports two types (auto-detected):
  #   git:   has 'url' field → sparse clone + register
  #   local: has 'path' field → direct register (path relative to env dir)
  # Local repos registered AFTER git repos → higher priority (overrides builtin)
  custom_repos:
    # Git repo: CP2K developer's spack repo. The master track FLOATS this
    # repo (no commit): assets fetches the branch tip per run and records
    # the resolved sha in resolved-repos.yaml beside spack.yaml; builds
    # apply that pin so the image-side clone matches the concretizer.
    # Master's recipes (tblite 0.7, gauxc snapshots, libxsmm → builtin)
    # are required by the 2027-line build.
    - url: https://github.com/cp2k/cp2k.git
      branch: master
      sparse_path: tools/spack/spack_repo/cp2k_dev
      namespace: cp2k_dev
    # force-AVX512 overrides for ELPA / FFTW / OpenBLAS (assets + image).
    # Default phases=both so concretize/lock and Dockerfile share the same repos.
    # Ahead of the ABACUS track (d0ee3f4): automake 1.18-series pin, the
    # elpa 2026.02.002 width-1 tail block (nx1) fix backport (cp2k#4484),
    # and the HAVE_AVX512_XEON forced-kernel fix (silent 2hv tau-flip drop).
    # Image registration uses image_path via spack_image_repos; sparse clone
    - url: https://github.com/s8ga/s8ga-spack-packages.git
      branch: master
      commit: 68400a5e35e060403892ad7780c0e7242fe4515f
      sparse_path: spack_repo/s8_overrides
      namespace: s8_overrides
      image_path: /opt/s8ga-spack-packages/spack_repo/s8_overrides

    # Local repo: latest builtin cp2k package.py plus the 2026.2 release
    # Registered AFTER git repos → highest priority for cp2k only
    - path: repos
      namespace: cp2k-env

# ── Template Variables ────────────────────────────────────────────────────
# Additional variables passed to Dockerfile.spack.j2 rendering.
# These become {{ key }} in the Jinja2 template.
template_vars:
  cp2k_dev_repo_path: tools/spack/spack_repo/cp2k_dev
  cp2k_branch: master
  # Fallback anchor for local renders without a resolved-repos.yaml sidecar;
  # assets + CI builds always override this with the run's resolved tip.
  cp2k_dev_repo_commit: dbd702d49d5c86e8db28d432a2ec045fd2761221
  # Same pin as custom_repos s8_overrides; ABACUS track stays on d0ee3f4.
#  amdgpu_targets: gfx942
