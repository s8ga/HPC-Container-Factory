# spack-envs/cp2k_opensource-master-force-avx512/spack-env-file/env.yaml
# Floating master track: spec is cp2k@master, lock is NEVER committed.
# cp2k_branch/cp2k_dev_repo_commit pin the cp2k_dev RECIPE repo at the
# cp2k master tip (master's build needs the newer recipes) — they do NOT
# pin the cp2k source, which floats via the spec and is recorded in the lock.
# This file is the single source of truth for all build configuration.

# Schema version for EnvironmentSpec parser.
schema_version: 1

# ── Container Images ──────────────────────────────────────────────────────
# Used by: Dockerfile.j2 ({{ builder_base_image }}, {{ runtime_base_image }})
#          Dockerfile.mirror-builder (ARG BASE_IMAGE)
# Pin floating tags by digest for reproducible FROM (authority opensource CPU).
# Refresh: podman pull debian:trixie && podman image inspect debian:trixie --format '{{.Digest}}'
images:
  builder: debian:trixie@sha256:d63a99144861e4e460196ed93d07777490cbeab53ca660c434f2a589a6c50ea3
  runtime: debian:trixie-slim@sha256:9bb8a3626890e084ab54e888fdd7c4b6d2f119071cd4c5dc5fecb4d73062aa5f

# ── Mirror Builder ────────────────────────────────────────────────────────
# Controls system package installation at runtime (inside streamline.sh).
# The mirror-builder image is a generic Spack-only container.
# These packages are installed by step_install_system_pkgs() on each run.
mirror_builder:
  # System packages to install in the mirror-builder container.
  # This REPLACES the hardcoded package list in Dockerfile.mirror-builder.
  system_pkgs:
    - bash
    - build-essential
    - ca-certificates
    - curl
    - environment-modules
    - gfortran
    - git
    - openssh-client
    - pkg-config
    - unzip
    - wget
    - cmake
    - file
    - automake
    - bzip2
    - xxd
    - xz-utils
    - zstd
    - ninja-build
    - patch
    - patchelf
    - pkgconf
    - libtool-bin
    - python3
    - python3-pip
    - python3-venv
  # Shell oneliner to configure package mirrors — runs as-is via eval.
  # No distro detection needed. Write whatever works for your base image.
  pkg_mirror_setup: "sed -i 's|deb.debian.org|mirrors.ustc.edu.cn|g; s|security.debian.org|mirrors.ustc.edu.cn/debian-security|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true"
  # Shell command to install packages (system_pkgs are appended automatically)
  pkg_install_cmd: "apt-get update -qq && apt-get install -y --no-install-recommends"

# ── Spack Environment ─────────────────────────────────────────────────────
# Used by: streamline.sh
spack:
  version: "1.2.0"
  env_name: cp2k-env
  buildcache:
    enabled: true
    padded_length: 128
    policy: auto
    coverage: non_external
  # Image uses env scope (unlike most CP2K Dockerfiles which use site) so
  # custom repos take priority over pinned builtin after ``repo update``.
  image:
    update_builtin: true
    repo_scope: env
  # Custom repos to clone and register
  # Supports two types (auto-detected):
  #   git:   has 'url' field → sparse clone + register
  #   local: has 'path' field → direct register (path relative to env dir)
  # Local repos registered AFTER git repos → higher priority (overrides builtin)
  custom_repos:
    # Git repo: CP2K developer's spack repo. The master track pins cp2k_dev
    # at the cp2k master tip (not the support branch): master's build needs
    # the newer recipes (tblite 0.7, pace, gauxc snapshots), and cp2k's own
    # tools/spack pins match that tip. Re-pin when dispatching a fresh float.
    - url: https://github.com/cp2k/cp2k.git
      branch: master
      commit: dd0921c61c802d1a0b9669263c27f207a68123dc
      sparse_path: tools/spack/spack_repo/cp2k_dev
      namespace: cp2k_dev
    # force-AVX512 overrides for ELPA / FFTW / OpenBLAS (assets + image).
    # Default phases=both so concretize/lock and Dockerfile share the same repos.
    # Pin matches ABACUS opensource track for shared s8ga monorepo.
    # Image registration uses image_path via spack_image_repos; sparse clone
    # still stages with template_vars.force_avx512_repo_path (dual-write guard).
    - url: https://github.com/s8ga/s8ga-spack-packages.git
      branch: master
      commit: d0ee3f460a2543c05c693317c767652abf964db7
      sparse_path: spack_repo/s8_overrides
      namespace: s8_overrides
      image_path: /opt/s8ga-spack-packages/spack_repo/s8_overrides

    # Local repo: latest builtin cp2k package.py plus the 2026.2 release
    # Registered AFTER git repos → highest priority for cp2k only
    - path: repos
      namespace: cp2k-env

# ── Template Variables ────────────────────────────────────────────────────
# Additional variables passed to Dockerfile.j2 rendering.
# These become {{ key }} in the Jinja2 template.
template_vars:
  cp2k_dev_repo_path: tools/spack/spack_repo/cp2k_dev
  cp2k_branch: master
  # cp2k master tip (git ls-remote); keep in sync with custom_repos.commit.
  cp2k_dev_repo_commit: dd0921c61c802d1a0b9669263c27f207a68123dc
  force_avx512_repo_url: https://github.com/s8ga/s8ga-spack-packages.git
  # Unused by image clone (kept for assets/docs); image pins via s8ga_repo_commit.
  force_avx512_repo_branch: master
  force_avx512_repo_path: spack_repo/s8_overrides
  # Same pin as custom_repos s8_overrides / ABACUS opensource track.
  s8ga_repo_commit: d0ee3f460a2543c05c693317c767652abf964db7
#  amdgpu_targets: gfx942
