# Spack environment for MPI-parallel CP2K 2026.2 (opensource, force-avx512).
# Baseline: support/v2026.2 tools/spack/cp2k_deps_p.yaml + make_cp2k.sh openmpi
# transform (mpich→openmpi, disable dla-future). force-avx512 comes from
# s8_overrides; the local repo overrides cp2k only.

spack:
  concretizer:
    unify: true

  config:
    connect_timeout: 30
    install_tree:
      root: /opt/spack
      padded_length: 0
    build_stage:
      - /tmp/spack-build
    deprecated: true

  packages:
    all:
      buildable: true
      prefer:
        - "~cuda"
        - "+fortran"
        - "+mpi"
        - "+mpi_f08"
        - "~opencl"
        - "+openmp"
        - "+pic"
        - "~rocm"
        - "~tests"
        - "build_system=cmake"
        - "build_type=Release"
        - "generator=ninja"
        - target="x86_64_v3"

    mpi:
      require:
        - openmpi

    mpich:
      require:
        - "~xpmem"

    xpmem:
      require:
        - "xpmem@master ~kernel-module"

    blas:
      require:
        - openblas

    lapack:
      require:
        - openblas

    libxs:
      require:
        - "+fortran"

    openblas:
      require:
        - "+dynamic_dispatch"
        - "+fortran"
        - "threads=openmp"
        - "build_system=makefile"
        - "+force_avx512"

    scalapack:
      require:
        - netlib-scalapack

    yasm:
      # Newer builtin recipes made yasm multi-build-system
      # (autotools|cmake), so the global all.prefer build_system=cmake
      # started steering it onto the cmake path — which misses
      # depends_on("cxx", type="build") and dies at the CMake compiler
      # probe ("SPACK_CXX_* variables not set"). isa-l only needs the
      # yasm assembler binaries; pin the proven autotools path until
      # upstream fixes the cmake variant.
      require:
        - "build_system=autotools"

    adios2:
      require:
        - "~bzip2"

    cosma:
      require:
        - "~cuda ~gpu_direct"
        - "+scalapack"

    dbcsr:
      require:
        - "~examples"
        - "+openmp"
        - "smm=libxs"

    deepmdkit:
      require:
        - "+pytorch"

    dftd4:
      require:
        - build_system=cmake

    elpa:
      require:
        - "+openmp"
        - "+force_all_x86_kernel"

    fftw:
      require:
        - "+openmp"
        - "+force_avx512"

    gauxc:
      require:
        - "+c"
        - "~cutlass"
        - "+fortran"
        - "+openmp"
        - "+skala skala_version=1.1"

    hdf5:
      require:
        - "+fortran"

    # NLCG left off (no +nlcg on cp2k). Deploy notes + kokkos pin live in the local
    # cp2k package.py nlcg variant comment (default=False).

    libfabric:
      require:
        # Do not require ~gdrcopy here: that variant only exists when +cuda,
        # so "~cuda ~gdrcopy" makes the solver demand both ~cuda and +cuda.
        - "~cuda"

    libint:
      require:
        - "+fortran"

    libxc:
      require:
        - "~cuda"
        - "+kxc"

    mctc-lib:
      require:
        - "~openmp"

    openpmd-api:
      require:
        - "+adios2"

    pexsi:
      require:
        - "+fortran"

    # Pin python 3.12 + networkx@:2.7 to avoid py-networkx@2.8+ → pandas/numba → llvm bloat.
    python:
      require:
        - "@3.12"
    py-networkx:
      require:
        - "@:2.7"

    py-torch:
      require:
        - "~distributed"
        - "~fbgemm"
        - "~kineto"
        - "~mkldnn"
        - "~rocm"
        - "~valgrind"
        - "~xnnpack"

    sirius:
      require:
        - "~apps"
        - "+dftd3"
        - "+dftd4"
        - "~dlaf"
        - "+elpa"
        - "+fortran"
        - "+pugixml"
        - "+scalapack"
        - "+vdwxc"

    spla:
      require:
        - "+fortran"

    trexio:
      require:
        - "+hdf5"

  repos:
    builtin:
      commit: 4b27eea0cc4158da30b27d19eafcd402ee9939bb  # LOCKED 2026-09-05 (bump deliberately: any builtin move rehashes the whole DAG and forces a full rebuild; 0.6-era pin lacked tblite 0.7)

  specs:
    # MPI stack (official default is mpich; openmpi path from make_cp2k.sh -mpi openmpi)
    - "openmpi@5.0.10"
    - "libfabric@2.5.1"
    - "dbcsr@2.10.0"
    - "netlib-scalapack@2.2.3"
    - "openblas@0.3.33"
    # Dependencies (support/v2026.2 cp2k_deps_p.yaml; dla-future disabled for openmpi)
    - "adios2@2.12.0"
    - "cosma@2.8.4"
    - "deepmdkit@3.1.3"
    - "dftd4@4.2.0"
    # s8_overrides currently provides force kernels through 2026.02.001.
    - "elpa@2026.02.001"
    - "fftw@3.3.11"
    - "gauxc@dev20260717"
    - "greenx@2.2"
    - "hdf5@2.1.0"
    - "libfci@0.1.0"
    - "libint@2.13.1-cp2k-lmax-7"
    - "libsmeagol@1.2"
    - "libvdwxc@0.5.0"
    - "libvori@220621"
    - "libxc@7.0.0"
    - "libxs@1.0.0"
    - "libxsmm@2.0.0"
    - "mctc-lib@0.4.2"
    # Spack package name is mimic_mcl (directory); older CP2K yaml used mimic-mcl.
    - "mimic-mcl@3.0.0"
    - "openpmd-api@0.17.0"
    - "pace@2025.12.4.1"
    - "pexsi@2.0.0"
    - "plumed@2.10.1"
    - "py-torch@2.12.1"
    - "sirius@7.11.1"
    - "spfft@1.1.1"
    - "spglib@2.7.0"
    - "spla@1.6.1"
    - "tblite@0.7.0"
    - "trexio@2.5.0"
    # CPU stack: +ace/+libfci/+mimic/+spla wired in local package.py; LibGint needs +cuda.
    # NLCG omitted (CP2K not officially supported; empty-enum crash if enabled).
    - "cp2k@master+ace+cosma+tblite+deepmd+dftd4~dlaf+elpa+greenx+grpp+hdf5+libfci+libint+libxc+mimic+pexsi+plumed+pytorch+sirius+smeagol+spglib+spla+trexio+vcsqnm+vdwxc+libvori+mpi_f08+gauxc+openpmd-api+shared smm=libxs lmax=7"

  # Create the unified view after `spack gc` in the Dockerfile (overlayfs +
  # spack v1.2.0 rename hits EXDEV if the env view updates during install).
  view: false


