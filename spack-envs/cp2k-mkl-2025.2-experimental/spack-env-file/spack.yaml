# Spack environment file for a MPI parallel CP2K binary with all available dependencies

spack:
  concretizer:
    unify: true
  config:
    install_tree:
      root: /opt/spack
      padded_length: 0
    build_stage:
    - /tmp/spack-build
  packages:
    all:
      buildable: true
      prefer:
      - ~cuda
      - +mpi
      - +openmp
      - +pic
      - ~rocm
      - target="x86_64_v3"
      providers:
        blas: [intel-oneapi-mkl]
        lapack: [intel-oneapi-mkl]
        mpi: [openmpi]
        fftw-api: [fftw]

    mpi:
      require:
        - openmpi
    mpich:
      require:
        - ~xpmem
    openmpi:
      require:
        - +internal-hwloc
    xpmem:
      buildable: false
      externals:
        - spec: xpmem@master
          prefix: /opt/spack

    intel-oneapi-mkl:
      require:
      - +shared
      - +cluster
      - +gfortran
      - ~ilp64
      - threads=openmp
      - mpi_family=openmpi
    # Dependencies for CP2K
    dbcsr:
      require:
        - ~examples
        - +openmp
        - smm=libxsmm
    deepmdkit:
      require:
        - build_system=cmake
        - +enable_pytorch
    dftd4:
      require:
        - build_system=cmake
    elpa:
      require:
        - +openmp
        - +force_all_x86_kernel
    fftw:
      require:
        - +openmp
        - +force_avx512
    hdf5:
      require:
        - +fortran
    libint:
      require:
        - +fortran
        - tune=cp2k-lmax-6
    libxc:
      require:
        - +kxc
        - build_system=cmake
    pexsi:
      require:
        - +fortran
    py-torch:
      require:
        - ~cuda
        - ~distributed
        - ~kineto
        - ~mkldnn
        - ~rocm
        - ~valgrind
    sirius:
      require:
        - +fortran
        - +pugixml
        - ~apps
        - +vdwxc
    spla:
      require:
        - +fortran
    trexio:
      require:
        - +hdf5
        - build_system=cmake

    libxsmm:
      require:
        - +shared
        - +large_jit_buffer
    mctc-lib:
      require:
        - ~openmp

    dla-future:
      require:
      - +scalapack
      - +ompi_grid_fix

    cp2k:
      require:
      - smm=libxsmm
      - lmax=6

    pika:
      require:
      - malloc=system


  specs:
    # Minimal
    - "dbcsr@2.8.0"
    - "libfabric@1.22.0"
    - "openmpi@5.0.8"
    - "intel-oneapi-mkl@2025.3.0"
    # All
    - "deepmdkit@3.1.0"
    - "dftd4@3.7.0"
    - "elpa@2025.01.001"
    - "fftw@3.3.10"
    - "greenx@2.2"
    - "hdf5@1.14.6"
    - "lammps-user-pace@2023.11.25.fix2"
    - "libint@2.9.0"
    - "libsmeagol@1.2"
    - "libvori@220621"
    - "libxc@7.0.0"
    - "libxsmm@1.17"
    - "pexsi@2.0.0"
    - "plumed@2.9.2"
    - "py-torch@2.7"
    - "sirius@7.9.0"
    - "spglib@2.5.0"
    - "spla@1.6.1"
    - "trexio@2.5.0"
    - "tblite@0.4.0"
    - "dla-future@0.10.0"
    - "dla-future-fortran@0.5.0"
    - "cp2k@2025.2~cosma+tblite+deepmd+dftd4+dlaf+elpa+greenx+grpp+hdf5+libint+libxc+pexsi+plumed+pytorch+sirius+smeagol+spglib+trexio+vcsqnm+vdwxc+libvori+mpi_f08+ace"
  view:
    default:
      root: ./view
      exclude:
        # Exclude gcc-runtime to avoid adding a copy of libgomp.so to the view
        - gcc-runtime

# EOF
