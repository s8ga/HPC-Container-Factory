# Spack environment file for ABACUS LTS 3.10.1 with OpenBLAS (force-avx512).
# Recipes: s8ga spack_repo/abacus + s8_overrides (pinned via env.yaml commit).
# Shared dependency pins match abacus_opensource-3.9.0.27-force-avx512.

spack:
  concretizer:
    unify: true
  config:
    deprecated: true
    install_tree:
      root: /opt/spack
      padded_length: 0
    build_stage:
    - /tmp/spack-build
  packages:
    all:
      buildable: true
      prefer:
        - ~cuda
        - +mpi
        - +openmp
        - +pic
        - ~rocm
        - target="x86_64_v3"
    mpi:
      require:
        - openmpi
    openmpi:
      require:
        - +internal-hwloc
    xpmem:
      buildable: false
      externals:
        - spec: xpmem@master
          prefix: /opt/spack
    blas:
      require:
        - openblas
    lapack:
      require:
        - openblas
    openblas:
      require:
        - +dynamic_dispatch
        - +fortran
        - threads=openmp
        - build_system=makefile
        - +force_avx512
    scalapack:
      require:
        - netlib-scalapack
    # force-avx512 math libs (s8_overrides)
    elpa:
      require:
        - +openmp
        - +force_all_x86_kernel
    fftw:
      require:
        - +openmp
        - +force_avx512
    # ABACUS dependencies
    deepmdkit:
      require:
        - build_system=cmake
        - +pytorch
    libxc:
      require:
        - +kxc
        - build_system=cmake
    pexsi:
      require:
        - +fortran
    # Pin python 3.12 + networkx@:2.7 to avoid py-networkx@2.8+ → pandas/numba → llvm.
    python:
      require:
        - "@3.12"
    py-networkx:
      require:
        - "@:2.7"
    py-torch:
      require:
        - ~cuda
        - ~distributed
        - ~kineto
        - ~mkldnn
        - ~rocm
        - ~valgrind
  repos:
    builtin:
      # Align with Spack 1.2.0 opensource track (cp2k_opensource-2026.2-force-avx512).
      commit: fc7222b5b8ababa8588be2e23ff39b33ecc9ce12
  specs:
    # Shared deps (ABACUS opensource force track)
    - "netlib-scalapack@2.2.3"
    - "openblas@0.3.33"
    - "openmpi@5.0.10"
    - "python@3.12"
    # All
    - "cereal@1.3.2"
    - "deepmdkit@3.1.3"
    - "elpa@2026.02.001"
    - "fftw@3.3.11"
    - "libcomm@0.1.1"
    - "libnpy@1.0.1"
    - "libri@0.2.1.1"
    - "libxc@7.0.0"
    - "pexsi@2.0.0"
    - "py-torch@2.4.1"
    - "abacus@3.10.1-lts+deepmd+deepks+elpa+lcao+libri+libxc+mpi+openmp+pexsi+tests"
  view: false

# EOF
