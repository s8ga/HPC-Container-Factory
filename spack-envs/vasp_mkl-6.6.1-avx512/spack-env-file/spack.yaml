# Spack environment for MPI-parallel VASP 6.6.1 + Intel oneMKL (AVX512 / x86_64_v4).
# Recipes: s8ga spack_repo/vasp + s8_overrides (pinned via env.yaml commit).
# Uses Spack 1.2 Spec Groups (`build-tools` at x86_64_v3 + `hpc-apps` at x86_64_v4)
# so cross-building on AVX2 hosts never hits SIGILL and `spack gc -y` prunes v3 build tools.

spack:
  concretizer:
    unify: true
    reuse: true
    targets:
      host_compatible: false
      granularity: generic
    duplicates:
      strategy: minimal

  config:
    connect_timeout: 30
    install_tree:
      root: /opt/spack
      padded_length: 0
    build_stage:
      - /tmp/spack-build
    deprecated: true

  packages:
    all:
      buildable: true
      prefer:
        - "~cuda"
        - "+fortran"
        - "+mpi"
        - "+mpi_f08"
        - "~opencl"
        - "+openmp"
        - "+pic"
        - "~rocm"
        - "~tests"
        - "build_system=cmake"
        - "build_type=Release"

    mpi:
      require:
        - openmpi

    mpich:
      require:
        - "~xpmem"

    openmpi:
      require:
        - "+internal-hwloc"
        - "target=x86_64_v3"

    xpmem:
      require:
        - "xpmem@master ~kernel-module"

    libfabric:
      require:
        - "~cuda"

    blas:
      require:
        - intel-oneapi-mkl

    lapack:
      require:
        - intel-oneapi-mkl

    fftw-api:
      require:
        - intel-oneapi-mkl

    scalapack:
      require:
        - netlib-scalapack

    netlib-scalapack:
      require:
        - "cflags='-ffp-contract=off -mprefer-vector-width=256'"
        - "fflags='-O2 -ffp-contract=off -mprefer-vector-width=256'"

    intel-oneapi-mkl:
      require:
        - "+shared"
        - "+gfortran"
        - "~ilp64"
        - "~cluster"
        - "threads=openmp"
    
    pkgconfig:
      require:
        - pkgconf
    
    elpa:
      require:
        - "+openmp"
        - "+force_all_x86_kernel"

    hdf5:
      require:
        - "+fortran"
        - "+mpi"

    libxc:
      require:
        - "~cuda"
        - "~fhc"
        - "+fortran"
        - "build_system=cmake"
        - "cflags='-ffp-contract=off -mprefer-vector-width=256'"
        - "fflags='-ffp-contract=off -mprefer-vector-width=256'"

    dftd4:
      require:
        - "build_system=cmake"

    simple-dftd3:
      require:
        - "build_system=cmake"

    mctc-lib:
      require:
        - "build_system=cmake"

    multicharge:
      require:
        - "build_system=cmake"

    wannier90:
      require:
        - "~mpi"
        - "+shared"

    libmbd:
      require:
        - "~shared"
        - "+static"
        - "~mpi"
        - "build_system=cmake"

    gmake:
      require: ["target=x86_64_v3"]
    cmake:
      require: ["target=x86_64_v3"]
    ninja:
      require: ["target=x86_64_v3"]
    pkgconf:
      # Avoid pkgconf 3.x ${includedir} expansion regression on transitive Requires: (mstore -> mctc-lib).
      require: ["@:2", "target=x86_64_v3"]
    perl:
      require: ["target=x86_64_v3"]
    python:
      require: ["target=x86_64_v3"]
    m4:
      require: ["target=x86_64_v3"]
    autoconf:
      require: ["target=x86_64_v3"]
    automake:
      require: ["target=x86_64_v3"]
    libtool:
      require: ["target=x86_64_v3"]
    bison:
      require: ["target=x86_64_v3"]
    flex:
      require: ["target=x86_64_v3"]
    gettext:
      require: ["target=x86_64_v3"]
    yasm:
      # Avoid builtin yasm CMake path missing cxx build dep under global prefer.
      require: ["build_system=autotools", "target=x86_64_v3"]
    re2c:
      require: ["target=x86_64_v3"]
    diffutils:
      require: ["target=x86_64_v3"]

  repos:
    builtin:
      commit: 01edd466b4da9e0e3c50fe18f58d46dca97e4b97

  specs:
    # Stage 1: Pin all host-executed build tools and their link/run deps to x86_64_v3.
    # explicit: false ensures `spack gc -y` prunes them before `/opt/spack-view` creation.
    - group: build-tools
      explicit: false
      specs:
        - cmake
        - gmake
        - ninja
        - "pkgconf@:2"
        - autoconf
        - automake
        - libtool
        - m4
        - bison
        - flex
        - perl
        - python@3.12
        - gettext
        - yasm
        - re2c
        - zlib
      override:
        packages:
          all:
            require:
              - target=x86_64_v3

    # Stage 2: VASP 6.6.1 and runtime/DFT libraries prefer x86_64_v4 while reusing build-tools.
    - group: hpc-apps
      needs: [build-tools]
      specs:
        # MPI & math stack
        - "openmpi@5.0.10"
        - "libfabric@2.6.0"
        - "intel-oneapi-mkl@2026.1.0"
        - "netlib-scalapack@2.2.3"
        - "elpa@2026.02.002"
        # VASP feature dependencies
        - "hdf5@1.14.6"
        - "libxc@7.1.2"
        - "dftd4@4.3.0"
        - "mctc-lib@0.6.1"
        - "multicharge@0.5.0"
        - "simple-dftd3@1.6.0"
        - "libmbd@0.15.0"
        - "wannier90@3.1.0"
        - "libbeef@0.1.3"
        - "cppflow@2.0.4aw"
        - "libtensorflow-cc@2.20.0"
        # Full-featured VASP 6.6.1 CPU CMake build (AVX-512 precision flags injected by recipe)
        - "vasp@6.6.1~cuda+dftd4+elpa~fftlib+grace+hdf5+libbeef+libmbd+libxc+openmp+sdftd3+shmem+vaspml+vaspsol+vtst+wannier90 build_system=cmake generator=ninja"
      override:
        packages:
          all:
            prefer:
              - target=x86_64_v4

  # Create the unified view after `spack gc` in the Dockerfile (overlayfs +
  # spack v1.2.0 rename hits EXDEV if the env view updates during install).
  view: false

# EOF
