# Auto-retry the nightly ONCE on any failure. One full rerun re-executes
# every job (cache-warm where the previous attempt succeeded); transient
# failures — asset-upload 500s, apt/git blips — usually clear on the
# second attempt. run_attempt < 2 caps it at one automatic retry, so the
# retried run's own completion cannot loop.
name: nightly-auto-retry

on:
  workflow_run:
    workflows: [nightly-cp2k]
    types: [completed]

permissions:
  actions: write

jobs:
  retry-any-failure:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2
    steps:
      - name: Retry the failed nightly once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          echo "nightly failed; retrying (full rerun, attempt 2 of 2)"
          gh run rerun "${RUN_ID}"
