# Reusable v3 CP2K build pipeline (prepare -> binaries -> package).
# Called by nightly-cp2k / stable-release / regen-lock via workflow_call.
#
# v3 eliminates hpc-cf-inputs and crane:
#   prepare  - validate + concretize lock only (--lock-only) + host OCI probe
#              (buildcache check-oci --write-state). If 0 specs are missing,
#              `binaries` is skipped completely.
#   binaries - producer build (--no-mirror --buildcache-mode oci)
#              pushing directly to ghcr.io + wiping /opt/spack inside builder RUN.
#   package  - consumer runtime image (--buildcache only --no-mirror) + push to
#              GHCR + extreme zstd-22 SIF conversion + live cp2k.psmp --version
#              & 2-rank MPI H2O smoke test before floating -release / publishing.

name: cp2k-pipeline

on:
  workflow_call:
    inputs:
      env_name:
        description: Environment name under spack-envs/
        required: false
        type: string
        default: cp2k_opensource-master-force-avx512
      channel:
        description: "stable: consume committed spack.lock, permanent releases; nightly: floating pre-release"
        required: false
        type: string
        default: nightly
      cp2k_commit:
        description: "Pin cp2k to this 40-char commit (nightly master track only)"
        required: false
        type: string
        default: ""
      fork_url:
        description: "Build cp2k from fork URL (nightly only)"
        required: false
        type: string
        default: ""
      fork_branch:
        description: "Fork branch to build (pair with fork_url)"
        required: false
        type: string
        default: ""
      prepare_only:
        description: "Run only prepare (lock + OCI probe) and skip binaries/package"
        required: false
        type: boolean
        default: false
      factory_ref:
        description: "Factory repo ref every job checks out. Default: v3."
        required: false
        type: string
        default: ""

env:
  DEFAULT_REF: ${{ inputs.factory_ref || 'v3' }}
  FLAGSHIP_ENV: "cp2k_opensource-master-force-avx512"

permissions:
  contents: write
  packages: write

concurrency:
  group: hpc-cf-pipeline-${{ inputs.env_name || 'cp2k_opensource-master-force-avx512' }}-${{ inputs.fork_url || 'upstream' }}-${{ inputs.fork_branch || 'default' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare (lock + check-oci)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      date: ${{ steps.vars.outputs.date }}
      needs_binaries: ${{ steps.probe.outputs.needs_binaries }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_REF || github.ref }}

      - name: Log in to GHCR
        run: |
          echo "${{ github.token }}" | podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Job preamble (pkg mirror, fork identity, venv, job vars)
        id: vars
        env:
          BASE_ENV_NAME: ${{ inputs.env_name || 'cp2k_opensource-master-force-avx512' }}
          CHANNEL: ${{ inputs.channel }}
          FORK_URL: ${{ inputs.fork_url }}
          FORK_BRANCH: ${{ inputs.fork_branch }}
          PUSH_BASE_MIRROR: "true"
        run: scripts/ci_job_preamble.sh

      - name: Validate environment config
        run: ./venv/bin/python -m hpc_cf validate --env "${ENV_NAME}" --profile config

      - name: Download Spack source tarball
        run: |
          mkdir -p assets
          curl -fsSL -o "assets/spack-v${SPACK_VER}.tar.gz" \
            "https://github.com/spack/spack/releases/download/v${SPACK_VER}/spack-${SPACK_VER}.tar.gz"

      - name: Cache Spack bootstrap mirror
        uses: actions/cache@v6
        with:
          path: assets/bootstrap-${{ env.SPACK_VER }}
          key: bootstrap-${{ env.SPACK_VER }}-v1

      - name: Stable builds require a committed lock
        if: ${{ inputs.channel == 'stable' }}
        run: |
          test -f "spack-envs/${ENV_NAME}/spack-env-file/spack.lock" || {
            echo "::error::stable build requires a committed spack.lock for ${ENV_NAME} at this ref"
            exit 1
          }

      - name: Pin cp2k commit (optional, nightly only)
        if: ${{ inputs.cp2k_commit != '' }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.channel }}" = "stable" ]; then
            echo "::error::cp2k_commit is nightly-only (stable consumes the committed lock)" >&2
            exit 1
          fi
          COMMIT="${{ inputs.cp2k_commit }}"
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::cp2k_commit must be a 40-char lowercase hex sha, got '$COMMIT'" >&2
            exit 1
          fi
          SPEC_FILE="spack-envs/${ENV_NAME}/spack-env-file/spack.yaml"
          grep -q 'cp2k@master' "$SPEC_FILE" || {
            echo "::error::no floating cp2k@master spec in ${SPEC_FILE}" >&2
            exit 1
          }
          if grep -qE 'cp2k@master[^"]*commit=' "$SPEC_FILE"; then
            echo "::error::${SPEC_FILE} already carries a cp2k commit pin" >&2
            exit 1
          fi
          sed -i -E "s/(cp2k@master[^\"]*)\"/\1 commit=${COMMIT}\"/" "$SPEC_FILE"
          grep -n "commit=${COMMIT}" "$SPEC_FILE"

      - name: Assets — concretize lock only
        run: |
          ARGS=(--env "${ENV_NAME}" --lock-only)
          if [ "${{ inputs.channel }}" != "stable" ]; then
            ARGS+=(--allow-concretize)
          fi
          ./venv/bin/python -m hpc_cf assets "${ARGS[@]}"

      - name: Upload build lock artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-lock
          path: |
            spack-envs/${{ env.ENV_NAME }}/spack-env-file/spack.lock
            spack-envs/${{ env.ENV_NAME }}/spack-env-file/resolved-repos.yaml
            spack-envs/${{ env.ENV_NAME }}/spack-env-file/lock-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Host OCI buildcache probe (check-oci)
        id: probe
        env:
          OCI_USER: ${{ github.actor }}
          OCI_PASS: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          ./venv/bin/python -m hpc_cf buildcache check-oci \
            --env "${ENV_NAME}" \
            --buildcache-mode oci --buildcache-url "${OCI_MIRROR}" \
            --buildcache-username-var OCI_USER --buildcache-password-var OCI_PASS \
            --write-state \
            --format json | tee oci-probe.json
          rc=${PIPESTATUS[0]}
          set -e
          if [ "${rc}" -eq 0 ]; then
            echo "needs_binaries=false" >> "${GITHUB_OUTPUT}"
          elif [ "${rc}" -eq 2 ]; then
            echo "needs_binaries=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::check-oci failed with rc=${rc}" >&2
            exit 1
          fi

      - name: Upload buildcache state on 100% OCI hit
        if: ${{ steps.probe.outputs.needs_binaries == 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: buildcache-state
          path: assets/spack-buildcache-state/
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: binaries (producer buildcache -> GHCR)
    needs: prepare
    if: ${{ !inputs.prepare_only && needs.prepare.outputs.needs_binaries == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      date: ${{ needs.prepare.outputs.date }}
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_REF || github.ref }}

      - name: Log in to GHCR
        run: |
          echo "${{ github.token }}" | podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Job preamble (pkg mirror, fork identity, venv, job vars)
        id: vars
        env:
          BASE_ENV_NAME: ${{ inputs.env_name || 'cp2k_opensource-master-force-avx512' }}
          CHANNEL: ${{ inputs.channel }}
          FORK_URL: ${{ inputs.fork_url }}
          FORK_BRANCH: ${{ inputs.fork_branch }}
          NIGHTLY_DATE_IN: ${{ needs.prepare.outputs.date }}
        run: scripts/ci_job_preamble.sh

      - name: Download Spack source tarball
        run: |
          mkdir -p assets
          curl -fsSL -o "assets/spack-v${SPACK_VER}.tar.gz" \
            "https://github.com/spack/spack/releases/download/v${SPACK_VER}/spack-${SPACK_VER}.tar.gz"

      - name: Cache Spack bootstrap mirror
        uses: actions/cache@v6
        with:
          path: assets/bootstrap-${{ env.SPACK_VER }}
          key: bootstrap-${{ env.SPACK_VER }}-v1

      - name: Download build lock artifact
        uses: actions/download-artifact@v8
        with:
          name: build-lock
          path: downloaded-lock

      - name: Place build lock
        run: |
          cp "downloaded-lock/spack.lock" \
            "spack-envs/${ENV_NAME}/spack-env-file/spack.lock"
          cp "downloaded-lock/resolved-repos.yaml" \
            "spack-envs/${ENV_NAME}/spack-env-file/resolved-repos.yaml" 2>/dev/null \
            || echo "::warning::no resolved-repos.yaml in the build-lock artifact"
          cp "downloaded-lock/lock-manifest.json" \
            "spack-envs/${ENV_NAME}/spack-env-file/lock-manifest.json" 2>/dev/null \
            || echo "::warning::no lock-manifest.json in the build-lock artifact"

      - name: Record builder CPU
        run: lscpu

      - name: Producer build — install and publish to GHCR (--no-mirror)
        id: producer
        env:
          OCI_USER: ${{ github.actor }}
          OCI_PASS: ${{ github.token }}
          GHCR_CREDS: |
            OCI_USER=${{ github.actor }}
            OCI_PASS=${{ github.token }}
        run: |
          ./venv/bin/python -m hpc_cf buildcache build --env "${ENV_NAME}" \
            --no-mirror \
            --engine podman --operation-timeout-seconds 19800 \
            --buildcache-mode oci --buildcache-url "${OCI_MIRROR}" \
            --buildcache-username-var OCI_USER --buildcache-password-var OCI_PASS \
            --build-secret buildcache-creds=GHCR_CREDS

      - name: Upload buildcache sidecar state
        if: always() && steps.producer.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: buildcache-state
          path: assets/spack-buildcache-state/
          if-no-files-found: warn
          retention-days: 7

  package:
    name: package (runtime + SIF + smoke test + release)
    needs: [prepare, binaries]
    if: ${{ always() && !inputs.prepare_only && needs.prepare.result == 'success' && (needs.binaries.result == 'success' || needs.binaries.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_REF || github.ref }}

      - name: Log in to GHCR
        run: |
          echo "${{ github.token }}" | podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Job preamble (pkg mirror, fork identity, venv, job vars)
        id: vars
        env:
          BASE_ENV_NAME: ${{ inputs.env_name || 'cp2k_opensource-master-force-avx512' }}
          CHANNEL: ${{ inputs.channel }}
          FORK_URL: ${{ inputs.fork_url }}
          FORK_BRANCH: ${{ inputs.fork_branch }}
          NIGHTLY_DATE_IN: ${{ needs.prepare.outputs.date }}
        run: scripts/ci_job_preamble.sh

      - name: Download Spack source tarball
        run: |
          mkdir -p assets
          curl -fsSL -o "assets/spack-v${SPACK_VER}.tar.gz" \
            "https://github.com/spack/spack/releases/download/v${SPACK_VER}/spack-${SPACK_VER}.tar.gz"

      - name: Cache Spack bootstrap mirror
        uses: actions/cache@v6
        with:
          path: assets/bootstrap-${{ env.SPACK_VER }}
          key: bootstrap-${{ env.SPACK_VER }}-v1

      - name: Download buildcache sidecar state
        uses: actions/download-artifact@v8
        with:
          name: buildcache-state
          path: assets/spack-buildcache-state/

      - name: Download build lock artifact
        uses: actions/download-artifact@v8
        with:
          name: build-lock
          path: downloaded-lock

      - name: Place build lock
        run: |
          cp "downloaded-lock/spack.lock" \
            "spack-envs/${ENV_NAME}/spack-env-file/spack.lock"
          cp "downloaded-lock/resolved-repos.yaml" \
            "spack-envs/${ENV_NAME}/spack-env-file/resolved-repos.yaml" 2>/dev/null \
            || echo "::warning::no resolved-repos.yaml in the build-lock artifact"
          cp "downloaded-lock/lock-manifest.json" \
            "spack-envs/${ENV_NAME}/spack-env-file/lock-manifest.json" 2>/dev/null \
            || echo "::warning::no lock-manifest.json in the build-lock artifact"

      - name: Consumer build (--buildcache only, --no-mirror)
        env:
          OCI_USER: ${{ github.actor }}
          OCI_PASS: ${{ github.token }}
          GHCR_CREDS: |
            OCI_USER=${{ github.actor }}
            OCI_PASS=${{ github.token }}
        run: |
          ./venv/bin/python -m hpc_cf build --env "${ENV_NAME}" --engine podman \
            --image "${IMAGE_NAME}" --tag "${TAG_PREFIX}-${NIGHTLY_DATE}" \
            --buildcache only --no-mirror \
            --buildcache-mode oci --buildcache-url "${OCI_MIRROR}" \
            --buildcache-username-var OCI_USER --buildcache-password-var OCI_PASS \
            --build-secret buildcache-creds=GHCR_CREDS

      - name: Remove builder/dangling images (keep runtime image)
        run: |
          podman images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E '^localhost/' \
            | grep -v ":${TAG_PREFIX}-${NIGHTLY_DATE}$" \
            | xargs -r podman rmi -f || true

      - name: Resolve release identity
        run: |
          ENV_NAME="${ENV_NAME:?must be resolved by the preamble}"
          NIGHTLY_DATE="${NIGHTLY_DATE:?must be resolved by the preamble}"
          ./venv/bin/python -m hpc_cf.release_notes identity \
            --env-name "${ENV_NAME}" \
            --channel "${{ inputs.channel }}" \
            --date "${NIGHTLY_DATE}" \
            --flagship-env "${FLAGSHIP_ENV}" >> "$GITHUB_ENV"

      - name: Cache Apptainer unprivileged install
        id: apptainer-cache
        uses: actions/cache@v6
        with:
          path: tools/apptainer
          key: apptainer-v1.5.2-${{ runner.arch }}

      - name: Ensure apptainer (rpm2cpio/cpio on cache miss)
        run: |
          set -euo pipefail
          if [ "${{ steps.apptainer-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y rpm2cpio cpio
            ./venv/bin/python -m hpc_cf build-sif --install-apptainer-only --yes
          fi
          echo "$PWD/tools/apptainer/bin" >> "$GITHUB_PATH"
          ./tools/apptainer/bin/apptainer --version
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null | grep -qx 1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -Ur true

      - name: Build SIF (zstd -22) and run live cp2k.psmp + 2-rank MPI smoke test
        run: |
          set -euo pipefail
          SMOKE='set -euo pipefail; cp2k.psmp --version >/dev/null && cat <<'"'"'INP'"'"' > /tmp/h2o_smoke.inp
          &GLOBAL
            PROJECT H2O_SMOKE
            RUN_TYPE ENERGY
          &END GLOBAL
          &FORCE_EVAL
            METHOD Quickstep
            &DFT
              BASIS_SET_FILE_NAME BASIS_MOLOPT
              POTENTIAL_FILE_NAME GTH_POTENTIALS
              &QS
                EPS_DEFAULT 1.0E-8
              &END QS
              &MGRID
                CUTOFF 100
              &END MGRID
              &SCF
                SCF_GUESS ATOMIC
                EPS_SCF 1.0E-5
                MAX_SCF 30
              &END SCF
              &XC
                &XC_FUNCTIONAL PBE
                &END XC_FUNCTIONAL
              &END XC
            &END DFT
            &SUBSYS
              &CELL
                ABC 8.0 8.0 8.0
              &END CELL
              &COORD
                O  0.000  0.000  0.000
                H  0.758  0.586  0.000
                H -0.758  0.586  0.000
              &END COORD
              &KIND O
                BASIS_SET DZVP-MOLOPT-SR-GTH
                POTENTIAL GTH-PBE-q6
              &END KIND
              &KIND H
                BASIS_SET DZVP-MOLOPT-SR-GTH
                POTENTIAL GTH-PBE-q1
              &END KIND
            &END SUBSYS
          &END FORCE_EVAL
          INP
          cd /tmp
          OMP_NUM_THREADS=1 mpirun --oversubscribe --bind-to none -np 2 cp2k.psmp -i /tmp/h2o_smoke.inp > /tmp/h2o_smoke.out
          grep -E "SCF run converged|ENERGY\| Total FORCE_EVAL|PROGRAM ENDED AT" /tmp/h2o_smoke.out
          grep -q "PROGRAM ENDED AT" /tmp/h2o_smoke.out
          rm -f /tmp/h2o_smoke.inp /tmp/h2o_smoke.out /tmp/H2O_SMOKE*'
          ./venv/bin/python -m hpc_cf build-sif \
            --env "${ENV_NAME}" \
            --docker-image "${IMAGE_NAME}" \
            --docker-tag "${TAG_PREFIX}-${NIGHTLY_DATE}" \
            --output "${SIF_NAME}" \
            --smoke-cmd "${SMOKE}" \
            --yes
          du -h "${SIF_NAME}"

      - name: Extract build manifest from local runtime image
        run: |
          set -euo pipefail
          podman create --name manifest-extract \
            "localhost/${IMAGE_NAME}:${TAG_PREFIX}-${NIGHTLY_DATE}" >/dev/null
          podman cp manifest-extract:/opt/spack-view/BUILD_MANIFEST.txt \
            "BUILD_MANIFEST-${ENV_NAME}-${NIGHTLY_DATE}.txt"
          podman cp manifest-extract:/opt/spack-view/DependencyGraph.dot \
            "DependencyGraph-${ENV_NAME}-${NIGHTLY_DATE}.dot" || true
          if podman cp manifest-extract:/etc/hpc-container-ident BUILD_IDENT 2>/dev/null; then
            echo "RELEASE_IDENT=$(cat BUILD_IDENT)" >> "$GITHUB_ENV"
          else
            echo "RELEASE_IDENT=" >> "$GITHUB_ENV"
          fi
          podman rm manifest-extract >/dev/null
          ls -la BUILD_MANIFEST-*.txt

      - name: Push runtime image and float verified -release tag
        run: |
          set -euo pipefail
          SRC="localhost/${IMAGE_NAME}:${TAG_PREFIX}-${NIGHTLY_DATE}"
          DATED="${IMG_REPO}:${ENV_SUFFIX}-${TAG_PREFIX}-${NIGHTLY_DATE}"
          podman tag "$SRC" "$DATED"
          podman push "$DATED"
          if [ "${{ inputs.channel }}" = "nightly" ]; then
            FLOATING="${IMG_REPO}:${ENV_SUFFIX}-nightly"
            podman tag "$SRC" "$FLOATING"
            podman push "$FLOATING"
          fi
          VERIFIED="${IMG_REPO}:${ENV_SUFFIX}-release"
          podman tag "$SRC" "$VERIFIED"
          podman push "$VERIFIED"
          podman inspect --format '{{.Digest}}' "$DATED"

      - name: Enforce single fork image version (fork envs only)
        if: ${{ contains(env.ENV_NAME, '-fork') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ghcr_prune_versions.sh \
            "/user/packages/container/${IMAGE_NAME}/versions" \
            "^${ENV_SUFFIX}-(nightly|stable|release)(-[0-9]{8})?$" \
            "${ENV_SUFFIX}-${TAG_PREFIX}-${NIGHTLY_DATE}" \
            0

      - name: Prune old runtime images (per-env tags, best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ghcr_prune_versions.sh \
            "/user/packages/container/${IMAGE_NAME}/versions" \
            "^${ENV_SUFFIX}-(nightly|stable|release)(-[0-9]{8})?$" \
            "${ENV_SUFFIX}-${TAG_PREFIX}-${NIGHTLY_DATE}" \
            7

      - name: Attach SIF to its release channel
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_URL: ${{ inputs.fork_url }}
          FORK_BRANCH: ${{ inputs.fork_branch }}
        run: |
          set -euo pipefail
          # Re-resolve identity with baked RELEASE_IDENT so the title includes the resolved sha.
          # Parse KEY=VALUE via IFS read (never `source`, since RELEASE_TITLE holds spaces/parens).
          IDENT_LINES="$(./venv/bin/python -m hpc_cf.release_notes identity \
            --env-name "${ENV_NAME}" \
            --channel "${{ inputs.channel }}" \
            --date "${NIGHTLY_DATE}" \
            --flagship-env "${FLAGSHIP_ENV}" \
            --ident "${RELEASE_IDENT:-}")"
          printf '%s\n' "${IDENT_LINES}" >> "$GITHUB_ENV"
          while IFS='=' read -r k v; do
            if [ -n "${k}" ]; then
              export "${k}=${v}"
            fi
          done <<< "${IDENT_LINES}"

          BUNDLE_ARGS=(
            --output "${META_BUNDLE_NAME}"
            --item "BUILD_MANIFEST.txt=BUILD_MANIFEST-${ENV_NAME}-${NIGHTLY_DATE}.txt"
            --item "spack.lock=spack-envs/${ENV_NAME}/spack-env-file/spack.lock"
          )
          if [ -f "DependencyGraph-${ENV_NAME}-${NIGHTLY_DATE}.dot" ]; then
            BUNDLE_ARGS+=(--item "DependencyGraph.dot=DependencyGraph-${ENV_NAME}-${NIGHTLY_DATE}.dot")
          fi
          ./venv/bin/python -m hpc_cf.release_notes bundle "${BUNDLE_ARGS[@]}"

          NOTES_ARGS=(
            --env-name "${ENV_NAME}"
            --channel "${{ inputs.channel }}"
            --date "${NIGHTLY_DATE}"
            --flagship-env "${FLAGSHIP_ENV}"
            --repository "${GITHUB_REPOSITORY}"
            --lock "spack-envs/${ENV_NAME}/spack-env-file/spack.lock"
            --env-yaml "spack-envs/${ENV_NAME}/spack-env-file/env.yaml"
            --sif "${SIF_NAME}"
            --oci-dated "${IMG_REPO}:${ENV_SUFFIX}-${TAG_PREFIX}-${NIGHTLY_DATE}"
            --oci-floating "${IMG_REPO}:${ENV_SUFFIX}-release"
            --fork-url "${FORK_URL:-}"
            --fork-branch "${FORK_BRANCH:-}"
            --ident "${RELEASE_IDENT:-}"
            --output release-notes.md
          )
          ./venv/bin/python -m hpc_cf.release_notes notes "${NOTES_ARGS[@]}"
          cat release-notes.md

          RELEASE_ASSETS=("${SIF_NAME}" "${META_BUNDLE_NAME}")
          if [ -n "${FLOATING_SIF_NAME:-}" ]; then
            cp -f "${SIF_NAME}" "${FLOATING_SIF_NAME}"
            RELEASE_ASSETS+=("${FLOATING_SIF_NAME}")
          fi

          if gh release view "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Move tag ref to today's commit, upload assets, and republish so
            # GitHub's published_at timestamp stays fresh at the top of Releases.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null 2>&1 || true
            gh release upload "${RELEASE_TAG}" "${RELEASE_ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" \
              --draft=true
            gh release edit "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" \
              --draft=false ${RELEASE_CREATE_FLAGS} \
              --title "${RELEASE_TITLE}" --notes-file release-notes.md
          else
            gh release create "${RELEASE_TAG}" "${RELEASE_ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" ${RELEASE_CREATE_FLAGS} \
              --title "${RELEASE_TITLE}" --notes-file release-notes.md
          fi

      - name: Prune old SIF assets (nightly channel only, best-effort)
        if: ${{ always() && inputs.channel == 'nightly' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${ENV_NAME}" in
            *-fork*) KEEP_DATES=1 ;;
            *)       KEEP_DATES=3 ;;
          esac
          IDS=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            | ./venv/bin/python -m hpc_cf.release_notes prune-plan --keep-dates "${KEEP_DATES}")
          for id in $IDS; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
          done

      - name: Prune old stable releases (stable channel only, best-effort)
        if: ${{ always() && inputs.channel == 'stable' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP=5
          mapfile -t OLD_TAGS < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName \
            --jq "[.[] | select(.tagName | test(\"^${RELEASE_STEM}-[0-9]{8}$\"))] | sort_by(.tagName) | reverse | .[${KEEP}:][] | .tagName")
          for tag in "${OLD_TAGS[@]}"; do
            echo "pruning stable release + tag: ${tag}"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          done
          echo "stable releases kept: newest ${KEEP} for ${RELEASE_STEM}"
