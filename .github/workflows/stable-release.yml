# Stable release track. Dispatch with an env_name (the folder under
# spack-envs/); the run itself cuts/re-points the frozen release/<env>
# branch at the dispatch commit before building, so no manual branch
# management is needed:
#
#   gh workflow run stable-release.yml --ref v2 -f env_name=<env>
#
# Why a frozen branch at all: stable builds take hours, and the Actions
# token may only create a release whose --target commit is the CURRENT
# branch head ("Resource not accessible by integration" otherwise —
# diagnosed 2026-10-29). Every job checks out the dispatch commit
# (factory_ref = github.sha), and the release/<env> pointer is moved to
# that same commit up front, so the head cannot drift mid-build.
# Same-env dispatches serialize via the hpc-cf-pipeline-<env>
# concurrency family; the re-cut of the next queued run happens only
# after the previous run finishes.
#
# Master moved after a release? Default: fix on v2, re-dispatch — the
# re-cut rebuild is mostly buildcache hits (~40 min warm). True hotfix
# without a full re-cut: cherry-pick onto release/<env> and dispatch
# from that branch (input left empty); supported but diverges the
# branch from v2 — use sparingly.
#
# Consumes the committed spack.lock fail-closed (no re-concretize) and
# attaches the SIF to a permanent per-build release that is never pruned.
name: stable-release

on:
  workflow_dispatch:
    inputs:
      env_name:
        description: "Environment folder under spack-envs/. Empty = derive from a release/<env> branch dispatch (backport mode). The run cuts/re-points release/<env> at the dispatch commit automatically."
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    name: resolve env and cut the release branch
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The exact tree this run builds and the release will tag.
          ref: ${{ github.sha }}
      - name: Derive ENV_NAME (input or branch name)
        # id is load-bearing: the job output reads steps.env.outputs.*.
        # A missing id yields an empty env_name, and the pipeline then
        # silently falls back to its cp2k default env — the 2026-10-29
        # misroute where an abacus dispatch built cp2k 2026.2 end to end.
        id: env
        env:
          INPUT_ENV: ${{ inputs.env_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_ENV}" ]; then
            ENV_NAME="${INPUT_ENV}"
          else
            case "${GITHUB_REF_NAME}" in
              release/*) ENV_NAME="${GITHUB_REF_NAME#release/}" ;;
              *)
                echo "::error::stable-release needs the env_name input (dispatched from any ref) or an empty input on a release/<env> branch (backport mode). Got neither on '${GITHUB_REF_NAME}'."
                exit 1
                ;;
            esac
          fi
          if [[ ! -d "spack-envs/${ENV_NAME}" ]]; then
            echo "::error::unknown env '${ENV_NAME}' (no spack-envs/${ENV_NAME} at ${GITHUB_SHA})"
            exit 1
          fi
          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "resolved env: ${ENV_NAME}"
      - name: Cut/re-point release/<env> at the dispatch commit
        run: |
          set -euo pipefail
          ENV_NAME="${{ steps.env.outputs.env_name }}"
          # Input mode re-points the frozen pointer to this commit (force:
          # it normally sits at the previous release; same-env dispatches
          # are serialized by the concurrency family, so no racing writer).
          # The tree's workflow files are identical to the pushed ref we
          # dispatched from, so the App-token workflow-file guard does not
          # trigger. Backport mode (dispatched ON the branch) is a no-op:
          # the pointer already sits at the dispatch commit.
          if [ -n "${{ inputs.env_name }}" ]; then
            git push --force "origin" "${GITHUB_SHA}:refs/heads/release/${ENV_NAME}"
            echo "release/${ENV_NAME} -> ${GITHUB_SHA}"
          else
            echo "backport mode: release/${ENV_NAME} stays at ${GITHUB_SHA}"
          fi

  pipeline:
    needs: resolve
    uses: ./.github/workflows/pipeline-cp2k.yml
    with:
      env_name: ${{ needs.resolve.outputs.env_name }}
      channel: stable
      # Build the exact dispatch commit — never a moving ref.
      factory_ref: ${{ github.sha }}
