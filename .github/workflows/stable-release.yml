# Stable release track. Primary mode: run on frozen release/<env-name>
# branches — the branch name IS the environment, and every job checks
# out that exact branch (pipeline factory_ref), so the whole run builds
# the tree that the release tag will point at. A workflow_dispatch
# env_name input is also accepted for ad-hoc runs from any ref; the
# frozen-branch publication guarantee then only holds if nothing is
# pushed to that ref mid-build (warned, not blocked).
#
# Why a frozen branch: stable builds take hours, and the Actions token may
# only create a release whose --target commit is the CURRENT branch head.
# On the moving development branch the head drifts past the dispatch SHA
# mid-build and publication 403s ("Resource not accessible by
# integration" — diagnosed 2026-10-29). A release branch never moves, so
# the run's GITHUB_SHA stays the head for the entire build.
#
# Operating procedure (nothing ever commits to release/* directly):
#   1. finish the env's lock on v2 (regen-lock workflow, commit the lock)
#   2. cut the release branch:   git push origin v2:refs/heads/release/<env>
#   3. dispatch:                 gh workflow run stable-release.yml \
#                                 --ref release/<env>
#   4. re-release later: re-cut the branch from the new v2 head, dispatch
#
# Consumes the committed spack.lock fail-closed (no re-concretize) and
# attaches the SIF to a permanent per-build release that is never pruned.
name: stable-release

on:
  workflow_dispatch:
    inputs:
      env_name:
        description: "Environment folder under spack-envs/ — empty = derive from the release/<env> branch name. Non-empty lets you dispatch from any ref, but the frozen-branch publication guarantee only holds on release/* branches."
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    name: resolve env from the release branch name
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Derive and validate ENV_NAME
        # id is load-bearing: the job output reads steps.env.outputs.*.
        # A missing id yields an empty env_name, and the pipeline then
        # silently falls back to its cp2k default env — the 2026-10-29
        # misroute where an abacus dispatch built cp2k 2026.2 end to end.
        id: env
        env:
          INPUT_ENV: ${{ inputs.env_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_ENV}" ]; then
            ENV_NAME="${INPUT_ENV}"
            case "${GITHUB_REF_NAME}" in
              release/*) ;;
              *)
                echo "::warning::dispatched with an explicit env from '${GITHUB_REF_NAME}' (not a release branch): the Actions token may only create the release tag while this commit stays the branch head — a mid-build push to this ref will fail publication."
                ;;
            esac
          else
            case "${GITHUB_REF_NAME}" in
              release/*) ;;
              *)
                echo "::error::stable-release needs env_name input OR a release/<env-name> branch (got '${GITHUB_REF_NAME}'). Cut one with: git push origin v2:refs/heads/release/<env>"
                exit 1
                ;;
            esac
            ENV_NAME="${GITHUB_REF_NAME#release/}"
          fi
          if [[ ! -d "spack-envs/${ENV_NAME}" ]]; then
            echo "::error::unknown env '${ENV_NAME}' (no spack-envs/${ENV_NAME} on ${GITHUB_REF_NAME})"
            exit 1
          fi
          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "resolved env: ${ENV_NAME} from ${GITHUB_REF_NAME}"

  pipeline:
    needs: resolve
    uses: ./.github/workflows/pipeline-cp2k.yml
    with:
      env_name: ${{ needs.resolve.outputs.env_name }}
      channel: stable
      # Build the frozen tree this branch holds, not the moving v2.
      factory_ref: ${{ github.ref_name }}
